<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель Атома</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(10, 10, 20, 0.85);
            padding: 12px 24px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            text-align: center;
            pointer-events: none;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
        }

        h1 {
            margin: 0 0 4px 0;
            font-size: 18px;
            letter-spacing: 1.5px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        p {
            margin: 0;
            font-size: 11px;
            color: #aaa;
        }

        #summary {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(10, 10, 20, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            max-width: 520px;
            width: 90%;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.15);
        }

        #summary h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #summary ul {
            margin: 0;
            padding-left: 18px;
            font-size: 12px;
            color: #ccc;
            line-height: 1.5;
        }

        #summary li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>МОДЕЛЬ АТОМА</h1>
        <p>Використовуйте мишу для обертання та наближення</p>
    </div>

    <div id="summary">
        <h3>Будова атома:</h3>
        <ul>
            <li><strong>Ядро:</strong> Центральна частина, що складається з протонів та нейтронів.</li>
            <li><strong>Електрони:</strong> Частинки, що рухаються навколо ядра по орбітах.</li>
        </ul>
    </div>

    <!-- Підключаємо необхідні бібліотеки Three.js та ефекти свічення (Bloom) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // Ініціалізація сцени
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 30;
        controls.minDistance = 3;

        // Пост-обробка для неонового свічення (Bloom)
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,  // Інтенсивність свічення
            0.4,  // Радіус
            0.85  // Поріг
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Освітлення студійного рівня
        const ambientLight = new THREE.AmbientLight(0x222244, 1.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ffff, 3, 50);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff0066, 3, 50);
        pointLight2.position.set(-10, -10, -10);
        scene.add(pointLight2);

        // --- ДЕТАЛІЗОВАНЕ ЯДРО ---
        const nucleusGroup = new THREE.Group();
        
        // Матеріали з високим ступенем відблиску (MeshPhysicalMaterial для реалістичного глянцю)
        const protonMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xff0055, 
            roughness: 0.2, 
            metalness: 0.1, 
            clearcoat: 1.0, 
            clearcoatRoughness: 0.1,
            emissive: 0xff0033,
            emissiveIntensity: 0.3
        });

        const neutronMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x4488ff, 
            roughness: 0.4, 
            metalness: 0.2, 
            clearcoat: 0.5,
            emissive: 0x0044aa,
            emissiveIntensity: 0.2
        });

        const nucleonGeo = new THREE.SphereGeometry(0.28, 32, 32);

        // Щільне укладання ядерних частинок
        for (let i = 0; i < 16; i++) {
            const isProton = i % 2 === 0;
            const mesh = new THREE.Mesh(nucleonGeo, isProton ? protonMat : neutronMat);
            
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = Math.cbrt(Math.random()) * 0.55;
            
            mesh.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
            
            nucleusGroup.add(mesh);
        }
        scene.add(nucleusGroup);

        // --- КВАНТОВІ ОРБІТАЛІ ТА ЕЛЕКТРОНИ ---
        const electronMat = new THREE.MeshPhysicalMaterial({
            color: 0x00ffff,
            emissive: 0x00ffff,
            emissiveIntensity: 2.0,
            roughness: 0.1,
            metalness: 0.8
        });
        const electronGeo = new THREE.SphereGeometry(0.1, 24, 24);

        const orbitsConfig = [
            { rx: 3.8, rz: 1.8, rotX: 0.4, rotZ: 0.2, speed: 0.006 },
            { rx: 2.2, rz: 4.2, rotX: -0.7, rotZ: 1.1, speed: 0.008 },
            { rx: 4.8, rz: 4.8, rotX: 1.3, rotZ: -0.4, speed: 0.004 }
        ];

        const electrons = [];

        orbitsConfig.forEach(cfg => {
            // Створюємо окрему групу для кожної орбіти, щоб вона тримала і лінію, і хмару, і електрон на своїй осі
            const orbitGroup = new THREE.Group();
            orbitGroup.rotation.x = cfg.rotX;
            orbitGroup.rotation.z = cfg.rotZ;
            scene.add(orbitGroup);

            // Лінія орбіти
            const curve = new THREE.EllipseCurve(0, 0, cfg.rx, cfg.rz, 0, 2 * Math.PI, false, 0);
            const points = curve.getPoints(120);
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p.x, 0, p.y)));
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.25 });
            const orbitLine = new THREE.Line(lineGeo, lineMat);
            orbitGroup.add(orbitLine);

            // Напівпрозора хмара ймовірності навколо орбіти
            const cloudGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p.x, 0, p.y))), 100, 0.12, 8, true);
            const cloudMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.04,
                blending: THREE.AdditiveBlending
            });
            orbitGroup.add(new THREE.Mesh(cloudGeo, cloudMat));

            // Електрон
            const electron = new THREE.Mesh(electronGeo, electronMat);
            orbitGroup.add(electron);

            electrons.push({
                mesh: electron,
                curve: curve,
                speed: cfg.speed,
                progress: Math.random()
            });
        });

        // Фонові частинки (ефект пилу у просторі)
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 300;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 25;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.03,
            color: 0x00ffff,
            transparent: true,
            opacity: 0.4
        });
        scene.add(new THREE.Points(particlesGeo, particlesMat));

        // Анімація
        function animate() {
            requestAnimationFrame(animate);

            // Плавне обертання ядра та фону
            nucleusGroup.rotation.y += 0.002;
            nucleusGroup.rotation.x += 0.001;

            // Рух електронів строго по їхній площині (орбіті)
            electrons.forEach(el => {
                el.progress += el.speed;
                if (el.progress > 1) el.progress = 0;

                const point = el.curve.getPoint(el.progress);
                el.mesh.position.set(point.x, 0, point.y);
            });

            controls.update();
            composer.render();
        }

        animate();

        // Адаптивність вікна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
